
## Excalidraw Complete

services:
  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: smart-excalidraw
    # user: uid:gid
    environment:
      - PUID=1000  # Replace with 'id -u'
      - PGID=1000  # Replace with 'id -g'
    network_mode: 'host'
    ports:
      - "8088:8080"
    restart: 'unless-stopped'
    # Volumes mounted
    volumes:
      - ${HOME}/${SERVERDATA}/excalidraw/designs:/storage